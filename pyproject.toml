[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "curio"
version = "0.1.0"
description = "Máquina de Conteúdo Educativo em Vídeo — pipeline local de vídeos curtos (MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
video-gen = "curio.cli:main"
curio-tui = "curio.tui:main"

[tool.setuptools.packages.find]
where = ["src"]
