# Arquivo de configuração do curio (PRD §18).
# Copie para `config.toml` e ajuste. Também é possível sobrescrever via
# variáveis de ambiente (ex.: CURIO_OUT_DIR, CURIO_TTS, CURIO_BACKEND).
# Segredos NUNCA vão no código — use env (ex.: CURIO_LLM_API_KEY).

duration_target = 0  # 0 = Automático/Ilimitado (padrão: o conteúdo manda);
# ou meta em segundos (30/45/60/90/120/180 ou 5..600) — meta, nunca corte
out_dir = "output"
queues_dir = "queues"  # pasta padrão das filas de ideias (CURIO_QUEUES_DIR)
language = "pt-BR"  # pt-BR ou en-US (100% em inglês: roteiro, título, voz e legendas)

[tts]
provider = "edge-tts"   # edge-tts (neural, grátis, sem login) | espeak-ng (local offline)
voice = "pt-BR-AntonioNeural"  # masculina PT-BR; espeak-ng usa "pt-br"
speed = 170              # palavras por minuto (só espeak-ng)

[render]
backend = "auto"         # auto | vaapi | qsv | cpu
width = 1080
height = 1920
fps = 30

[subtitles]
font_size = 92   # base para altura 1920, em pixels reais (ASS PlayRes = resolução)
margin_v = 200   # margem inferior (Alignment=2: legendas na base)

# Roteiros via NVIDIA API. Chaves NUNCA aqui — use .env
# (NVIDIA_API_KEY ou futura NVIDIA_API_KEYS="key1,key2").
# Sem chave, o pipeline usa o gerador local (curado + template, custo zero).
# [nvidia]
# base_url = "https://integrate.api.nvidia.com/v1"
# model = "nvidia/nemotron-3-ultra-550b-a55b"
# timeout = 120

# Fallback automático quando a NVIDIA falha (roteiro e cenas).
# Chave via .env (OPENROUTER_API_KEY); aqui só modelo/base.
# [openrouter]
# model = "google/gemini-2.5-flash"
# base_url = "https://openrouter.ai/api/v1"

# Gemini direto e Groq entram no mesmo rodízio (chaves via .env:
# GEMINI_API_KEY e GROQ_API_KEY). Ordem: NVIDIA → OpenRouter → Gemini → Groq.
# [gemini]
# model = "gemini-2.5-flash"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# [groq]
# model = "openai/gpt-oss-120b"
# base_url = "https://api.groq.com/openai/v1"

[media]
providers = "pixabay,pexels,wikimedia"  # csv; "none" = só fallback
# cache em cache/media/<provedor>/<id> (CURIO_CACHE_DIR muda o root)

[visual]
max_images = 3  # fotos por cena no modo roteiro-pronto (1-5; CURIO_VISUAL_MAX_IMAGES)
overlap = 0.9   # sobreposição máxima (s) entre fotos (CURIO_VISUAL_OVERLAP)
sfx = true      # SFX discretos em ~1/3 das inserções (CURIO_VISUAL_SFX=0 desliga)

[teleprompter]
wpm = 150  # palavras/minuto estimadas p/ leitura (ajuste: 130/150/170)
file_manager = "dolphin"  # aberto na pasta do teleprompter pós-geração
audio_recorder = "audacity"  # gravador aberto junto
auto_open = true  # false desliga; sem sessão gráfica nunca abre

[transcribe]
model = "base"  # faster-whisper local (tiny|base|small|medium)
