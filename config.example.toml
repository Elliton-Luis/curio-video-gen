# Arquivo de configuração do curio (PRD §18).
# Copie para `config.toml` e ajuste. Também é possível sobrescrever via
# variáveis de ambiente (ex.: CURIO_OUT_DIR, CURIO_TTS, CURIO_BACKEND).
# Segredos NUNCA vão no código — use env (ex.: CURIO_LLM_API_KEY).

duration_target = 0  # 0 = Automático/Ilimitado (padrão: o conteúdo manda);
# ou meta em segundos (30/45/60/90/120/180 ou 5..600) — meta, nunca corte
out_dir = "output"
queues_dir = "queues"  # pasta padrão das filas de ideias (CURIO_QUEUES_DIR)
language = "pt-BR"  # pt-BR ou en-US (100% em inglês: roteiro, título, voz e legendas)

# Gênero editorial. VAZIO = nenhum gênero, e o vídeo sai exatamente como
# antes do recurso. Escolher um gênero muda o pipeline de verdade: ritmo
# (segundos por cena), estrutura do roteiro, estratégia de pesquisa,
# vocabulário visual da cena, medium preferido e densidade das legendas.
# Chaves: history | etymology | mythology | mystery | science | people
# A TUI oferece o seletor visual (← →, Enter). O env sobrescreve:
# CURIO_GENRE=people
genre = ""

[tts]
provider = "edge-tts"   # edge-tts (neural, grátis, sem login) | espeak-ng (local offline)
voice = "pt-BR-AntonioNeural"  # masculina PT-BR; espeak-ng usa "pt-br"
speed = 170              # palavras por minuto (só espeak-ng)

[render]
backend = "arc"          # arc (Intel B580 primeiro, ex.: AV1 VA-API) | auto | vaapi | qsv | cpu
width = 1080
height = 1920
fps = 30

[subtitles]
font_size = 92   # base para altura 1920, em pixels reais (ASS PlayRes = resolução)
margin_v = 200   # margem inferior (Alignment=2: legendas na base)

# Roteiros via NVIDIA API. Chaves NUNCA aqui — use .env
# (NVIDIA_API_KEY ou futura NVIDIA_API_KEYS="key1,key2").
# Sem chave, o pipeline usa o gerador local (curado + template, custo zero).
# [nvidia]
# base_url = "https://integrate.api.nvidia.com/v1"
# model = "nvidia/nemotron-3-ultra-550b-a55b"
# timeout = 15         # tempo de espera da chamada (é um teto de socket:
#                       # vale para o handshake e para cada recv; um modelo
#                       # que transmite algo de tempos em tempos não é cortado)
# timeout_max = 15      # teto do mesmo timeout. Padrão 15 = o comportamento
#                       # antigo. Suba só se o seu modelo for lento demais e
#                       # você aceitar esperar mais antes do fallback.
# Com os outros providers indisponíveis, a NVIDIA entra em fallback final
# resiliente: até 5 tentativas sem timeout; 401/403/404 encerram sem retry.

# Fallback automático quando a NVIDIA falha (roteiro e cenas).
# Chave via .env (OPENROUTER_API_KEY); aqui só modelo/base.
# [openrouter]
# model = "google/gemini-2.5-flash"
# base_url = "https://openrouter.ai/api/v1"

# Gemini direto e Groq entram no mesmo rodízio (chaves via .env:
# GEMINI_API_KEY e GROQ_API_KEY). Ordem: NVIDIA → OpenRouter → Gemini → Groq.
# [gemini]
# model = "gemini-2.5-flash"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# [groq]
# model = "openai/gpt-oss-120b"
# base_url = "https://api.groq.com/openai/v1"

[media]
providers = "pixabay,unsplash,pexels,nasa,wikimedia"  # csv; "none" = só fallback
# unsplash exige UNSPLASH_ACCESS_KEY; nasa não exige chave (acervo público)
# cache em cache/media/<provedor>/<id> (CURIO_CACHE_DIR muda o root)
#
# Cenas do tipo historical_art invertem esta ordem: os acervos de arte
# (wikimedia, openverse) vêm primeiro, porque pintura/fresco/escultura de
# domínio público são o visual certo para um santo ou um evento antigo, e
# foto moderna de banco é pior que nenhuma imagem.

# Seleção (variáveis de ambiente — o config.toml não as expõe):
#   CURIO_MEDIA_SCORE_MIN=34        nota mínima 0-100; 0 desliga o corte.
#                                   Abaixo dela a cena NÃO fica com a imagem
#                                   "menos ruim": ela troca de estratégia
#                                   visual (diagrama ou cartão tipográfico).
#   CURIO_MEDIA_MIN_DIMENSION=1080  lado mínimo em px, já que o render
#                                   recorta e amplia para 1080x1920.

# Pontuação semântica — OPCIONAL e desligada por padrão. A camada base
# (lexical, sobre o título da imagem) é a padrão e não precisa de nada
# além deste projeto. CLIP é ponto de extensão: o curio NÃO instala
# torch/open_clip nem baixa pesos de modelo.
#   CURIO_CLIP_ENABLED=1     liga (exige torch + open_clip instalados à mão)
#   CURIO_CLIP_DEVICE=auto   auto | xpu | cuda | mps | cpu
# Com "auto" o projeto procura aceleradores que existam de fato no torch
# instalado (xpu = Intel, cuda, mps) e só cai para cpu se nenhum houver.
# CLIP entra depois dos filtros e da nota base, só nos melhores
# candidatos. `video-gen doctor` mostra o estado e o device.

[visual]
max_images = 3  # fotos por cena no modo roteiro-pronto (1-5; CURIO_VISUAL_MAX_IMAGES)
overlap = 0.9   # sobreposição máxima (s) entre fotos (CURIO_VISUAL_OVERLAP)
sfx = true      # SFX discretos em ~1/3 das inserções (CURIO_VISUAL_SFX=0 desliga)

# Inserções esparsas: fotos COMPLEMENTARES que caem por cima da imagem de
# fundo. O orçamento é do VÍDEO INTEIRO (não por cena): 1–2 é o ponto ideal,
# mais que isso vira slideshow. 0 = cada cena mostra só o fundo.
# As cenas escolhidas ficam no miolo do vídeo — a abertura e o fecho ficam
# limpos — e cada inserção tem um toque de som discreto no instante exato
# em que a foto entra. As legendas não são tocadas.
insertions = 2         # 0-5 (CURIO_VISUAL_INSERTIONS)
insert_style = "drop_in"  # caiu do álbum; alternatives: slide_left, slide_right,
                          # fade, scale_in, tilt_in (CURIO_VISUAL_INSERT_STYLE)
# Pico alvo do som da inserção, em dBFS (negativo = mais baixo).
# -30 = cerca de 24 dB abaixo da narração: presente, não compete.
# Abaixo de -45 some; acima de -12 briga com a voz. Faixa aceita: -45..-12.
insert_gain_db = -30   # (CURIO_VISUAL_INSERT_GAIN_DB)

# Biblioteca persistente. Só `video-gen music update` baixa assets; o render
# normal consulta os arquivos locais e não pesquisa a cada vídeo. Para permitir
# autopreenchimento quando abaixo do mínimo, habilite music.auto_fill.
[audio]
library_dir = "assets/library"  # também: CURIO_AUDIO_LIBRARY_DIR
transitions = "auto"            # auto | none

[music]
mode = "auto"                    # auto | none | manual
file = ""                        # caminho usado quando mode = "manual"
gain_db = -30                     # conservador; permitido: -40..-15 dB
ducking = true
auto_fill = true                  # busca só quando biblioteca < mínimo

[music.library]
min_per_genre = 3
target_per_genre = 6
max_per_genre = 10

[sfx]
library_enabled = true            # assets locais substituem SFX sintéticos pontuais
auto_fill = true                   # busca só quando biblioteca < mínimo

[sfx.library]
min_per_category = 2
target_per_category = 5
max_per_category = 8

# Única fonte automática inicial: API oficial Freesound; somente previews com
# licença CC0 ou CC BY são aceitos. CC BY exige atribuição no metadata. Cadastre
# a chave da aplicação oficial em .env (nunca no TOML):
# FREESOUND_API_KEY=...

[teleprompter]
wpm = 150  # palavras/minuto estimadas p/ leitura (ajuste: 130/150/170)
file_manager = "dolphin"  # aberto na pasta do teleprompter pós-geração
audio_recorder = "audacity"  # gravador aberto junto
auto_open = true  # false desliga; sem sessão gráfica nunca abre

[transcribe]
model = "base"  # faster-whisper local (tiny|base|small|medium)

[research]
max_sources = 3  # fontes web exigidas p/ grounding (≥1; CURIO_RESEARCH_MAX_SOURCES)
timeout = 20  # teto por chamada da Wikipedia em segundos (CURIO_RESEARCH_TIMEOUT)

# --- Tipografia por gênero -------------------------------------------
# A fonte decide por PAPEL, não globalmente: a narração e a citação são
# vozes diferentes e precisam parecer diferentes. A cena declara a
# função ("quote", "latin", "person") e o perfil abaixo decide o desenho.
#
# Nenhuma fonte é baixada. O curio pergunta ao fontconfig o que já está
# instalado e cai numa cadeia genérica quando a pedida não existe — o
# `doctor` mostra qual fonte respondeu. A Minion Pro é proprietária:
# instale você, se quiser.
#
# Chaves aceitas por gênero: primary (serifada), italic (serifada
# inclinada), sans, mono, condensed, fallback. Trocar `primary` move
# todos os papéis serifados de uma vez.
[typography.people]
primary = "Minion Pro"
italic = "Minion Pro Italic"
#sans = "Inter"
#mono = "Source Code Pro"
#fallback = "EB Garamond"

# Escape hatch: a fonte de UM papel só. Útil quando um gênero tem uma
# voz que não é a do resto.
#[typography.people.roles]
#quote = "Cormorant Garamond"

# Os outros cinco, para quando você escolher outro gênero. Comentados
# para não atrapalhar quem só quer o de people.
#[typography.history]
#primary = "Minion Pro"
#italic = "Minion Pro Italic"
#[typography.etymology]
#primary = "EB Garamond"
#italic = "EB Garamond Italic"
#[typography.mystery]
#sans = "Roboto Condensed"
#mono = "IBM Plex Mono"
#[typography.mythology]
#primary = "Adobe Caslon Pro"
#[typography.science]
#sans = "Inter"
#mono = "JetBrains Mono"

# As legendas NÃO são redirecionadas por aqui, e isso é deliberado: a
# fonte de exibição pesada fica, porque legibilidade vale mais que
# estilo. A identidade entra no título, na citação, no cartão e no nome.
# O teleprompter também fica de fora, pelo mesmo motivo — é um arquivo de
# narração para ler ao vivo, não de identidade editorial.
#
# Se a família pedida não existir na máquina, o curio desce o gênero
# inteiro para a primeira da cadeia que tem os dois rostos (reto e
# itálico), para o título e a citação não saírem em famílias diferentes.
# A cadeia genérica de serifadas começa por Utopia — mesmo desenhista da
# Minion Pro. O `doctor` e a folha de contato mostram qual respondeu.
